# Heretic DGX on four NVIDIA DGX Sparks (tensor parallel 4).
#
# Four nodes, one NCCL rank each, for models that do not fit on two Sparks --
# specifically DeepSeek V4.1 Flash, whose transformer weights need TP4 and
# whose Engram n-gram tables (189.1 GiB in fp8, 47.3 GiB per rank) stay on
# the SSD.
#
# Copy outside the repository, fill in real values, and do not commit it.
#
#   cp cluster.tp4.example.toml ../heretic-cluster-tp4.toml
#
# Run from the coordinator (the first node listed):
#
#   uv run heretic \
#     --cluster ../heretic-cluster-tp4.toml \
#     --config ./config.default.toml \
#     --model /models/DeepSeek-V4.1-Flash
#
# See docs/TP4.md for the full runbook, including the checkpoint layout the
# Engram disk mode expects.

# Absolute path to the interpreter on every node. Must exist at this path on
# all four hosts, and must be the same Python that has heretic installed.
python = "/opt/heretic-dgx/.venv/bin/python"

# Absolute path to the checkout on every node. Each rank runs
# `python -m heretic.rank_application` from here, with PYTHONPATH=<workdir>/src.
workdir = "/opt/heretic-dgx"

backend = "nccl"
master_port = 29500

# --- Timeouts ---------------------------------------------------------------
#
# timeout_seconds bounds the ENTIRE rank application, not just startup. Every
# rank is launched wrapped in coreutils `timeout`, and the launching process
# enforces the same deadline, so this is the wall-clock budget for the whole
# optimization run. When it expires the rank is terminated (SIGTERM, then
# SIGKILL after 5s).
#
# That makes it the natural stage gate for a long run: completed Optuna trials
# are persisted, so the next run resumes from where this one stopped.
#
# 604800 = 7 days, sized for a full 200-trial run. See docs/STAGED_RUN_PLAN.md
# for the per-stage values (a first 5-trial smoke test does not need 7 days).
timeout_seconds = 604800

# The process-group collective timeout. Deliberately separate from the run
# deadline above: a multi-day run still needs a genuinely hung NCCL collective
# to fail in minutes, not days. Must not exceed timeout_seconds.
#
# 1800 = 30 minutes, which is ample for NCCL rendezvous even over a mesh.
collective_timeout_seconds = 1800

# The fabric interface used for NCCL traffic (not the management path). On a
# four-node Spark cluster this is the high-speed interconnect, for example
# "enp1s0f0np0" or "enP2p1s0f0np0". Verify with `ip -br link` on each node.
nccl_socket_ifname = "<fabric-interface>"

# --- Engram (n-gram) tables on disk ----------------------------------------
#
# DeepSeek V4.1 Flash keeps its n-gram hash tables on the SSD instead of in
# memory. This is what makes TP4 viable: the tables are 189.1 GiB in total
# (47.3 GiB per rank), on top of a 71.5 GiB-per-rank backbone, against 128 GB
# of unified memory per node shared with the host.
#
# engram_disk_path must point at a directory holding `config.json`,
# `model.safetensors.index.json` and the `model-*-of-*.safetensors` shards, at
# the same absolute path on all four nodes. Every one of those entries must be
# a REGULAR FILE: Heretic's preflight refuses symlinks (it opens checkpoint
# payloads with O_NOFOLLOW), so a Hugging Face cache `snapshots/` directory
# cannot be used directly -- see docs/TP4.md section 5. The tables are opened
# O_RDONLY and never written.
engram_disk = true
engram_disk_path = "/models/DeepSeek-V4.1-Flash"
engram_disk_threads = 32
engram_disk_chunk = 16

# --- The four nodes, ordered by rank ---------------------------------------
#
# Rank 0 is the coordinator and is launched locally; ranks 1-3 are launched
# over SSH. `host` is the SSH destination (an alias from ~/.ssh/config works
# well); `rank_address` is the address NCCL uses for rank traffic, and rank 0's
# rank_address becomes MASTER_ADDR.
#
# CHOOSE RANK 0 FOR WHERE THE EXPORT SHOULD LAND. Only rank 0 writes an export:
# LocalModelRuntime.save_adapter/save_merged send every non-zero rank to a
# tempfile.mkdtemp() sink that is deleted afterwards, and only rank 0 reaches the
# export menu. Rank 0 is launched locally, so "save the model on node X" means
# "make node X rank 0, and run the launcher from node X". If there is no shared
# filesystem, that is the only way to direct the output.
#
# The addresses below are Tailscale (100.64.0.0/10) mesh addresses. If your
# nodes also have a direct high-speed fabric, prefer those addresses for
# rank_address and keep Tailscale for the SSH `host` path -- collective
# performance over a mesh is much worse than over a direct link.

[[nodes]]
host = "<coordinator-ssh-host>"
rank_address = "<coordinator-fabric-address>"

[[nodes]]
host = "<worker-1-ssh-host>"
rank_address = "<worker-1-fabric-address>"

[[nodes]]
host = "<worker-2-ssh-host>"
rank_address = "<worker-2-fabric-address>"

[[nodes]]
host = "<worker-3-ssh-host>"
rank_address = "<worker-3-fabric-address>"
